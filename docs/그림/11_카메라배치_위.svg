<text x="60" y="800" font-size="13" fill="#222">웹캠은 매트 위쪽 끝(15~27번 줄 뒤)에서 8cm 밖에 두고, 통로 A 건너편 1~14번 줄을 정면으로 봅니다. 1~14번 줄은 렌즈에서 33~40cm.</text>
