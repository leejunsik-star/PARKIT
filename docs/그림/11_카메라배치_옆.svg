<svg xmlns="http://www.w3.org/2000/svg" width="1070" height="480" viewBox="0 0 1070 480" font-family="NanumSquareRound, NanumGothic, 'Malgun Gothic', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#444"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="70" y="30" font-size="20" font-weight="bold" fill="#222">옆에서 본 모습 (CAM-2 기준 단면)</text>
<line x1="70" y1="330" x2="1000" y2="330" stroke="#333" stroke-width="3"/>
<rect x="220" y="330" width="43.5" height="10" fill="#999"/>
<text x="241.75" y="360" font-size="12" text-anchor="middle" fill="#333"></text>
<rect x="263.5" y="330" width="127.5" height="10" fill="#777"/>
<text x="327.25" y="360" font-size="12" text-anchor="middle" fill="#333">15~27번</text>
<rect x="391.0" y="330" width="38.99999999999999" height="10" fill="#3fbf8f"/>
<text x="410.5" y="360" font-size="12" text-anchor="middle" fill="#333"></text>
<rect x="430.0" y="330" width="120.0" height="10" fill="#555"/>
<text x="490.0" y="360" font-size="12" text-anchor="middle" fill="#333">통로 A</text>
<rect x="550.0" y="330" width="112.5" height="10" fill="#ff8a3d"/>
<text x="606.25" y="360" font-size="12" text-anchor="middle" fill="#333">1~14번 줄</text>
<rect x="662.5" y="330" width="48.00000000000004" height="10" fill="#e0a030"/>
<text x="686.5" y="360" font-size="12" text-anchor="middle" fill="#333"></text>
<rect x="710.5" y="330" width="101.99999999999996" height="10" fill="#777"/>
<text x="761.5" y="360" font-size="12" text-anchor="middle" fill="#333">28~41번</text>
<rect x="812.5" y="330" width="73.49999999999997" height="10" fill="#555"/>
<text x="849.25" y="360" font-size="12" text-anchor="middle" fill="#333">통로 B</text>
<rect x="920.5" y="330" width="79.49999999999996" height="10" fill="#777"/>
<text x="960.25" y="360" font-size="12" text-anchor="middle" fill="#333">42~56번</text>
<text x="220" y="378" font-size="12" text-anchor="start" fill="#333">← 매트 끝</text>
<rect x="554.5" y="300.0" width="105" height="30.0" rx="8" fill="#d4b106" stroke="#222"/>
<rect x="274.0" y="300.0" width="105" height="30.0" rx="8" fill="#2f6b3a" stroke="#222"/>
<line x1="100.0" y1="330" x2="100.0" y2="105" stroke="#999" stroke-dasharray="4 4"/>
<text x="92.0" y="217.5" font-size="13" text-anchor="end" fill="#222">15cm</text>
<line x1="100.0" y1="400" x2="220" y2="400" stroke="#444" marker-end="url(#ar)"/>
<text x="160.0" y="416" font-size="12" text-anchor="middle" fill="#444">8cm</text>
<path d="M489.7114317029974 330 A450 450 0 0 0 550.0 105" fill="none" stroke="#2a9d5b" stroke-width="2" stroke-dasharray="3 5"/>
<text x="543.0" y="161.25" font-size="12" fill="#2a9d5b">렌즈에서 30cm: 이보다 멀면 선명</text>
<line x1="100.0" y1="105" x2="489.7114317029974" y2="330" stroke="#ff8a3d" stroke-width="3" stroke-dasharray=""/>
<text x="263.67880131525885" y="189.5" font-size="13" font-weight="bold" fill="#ff8a3d">화면 중심 30°</text>
<line x1="100.0" y1="105" x2="922.4614797967583" y2="330" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="926.4614797967583" y="322.5" font-size="12" fill="#666">화면 위 끝</text>
<line x1="100.0" y1="105" x2="327.3686181917533" y2="330" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="331.3686181917533" y="291.0" font-size="12" fill="#666">화면 아래 끝</text>
<rect x="66.0" y="89" width="68" height="26" rx="6" fill="#ff8a3d" stroke="#111"/>
<text x="100.0" y="108" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">CAM-2</text>
<path d="M170.0 105 A70 70 0 0 1 160.62177826491072 140.0" fill="none" stroke="#222"/>
<line x1="100.0" y1="105" x2="190.0" y2="105" stroke="#222" stroke-dasharray="3 3"/>
<text x="176.0" y="129" font-size="13" fill="#222">30°</text>
<text x="70" y="450" font-size="13" fill="#444">1~14번 줄은 렌즈에서 33~40cm라 초점이 맞습니다. 통로 A 앞쪽(27cm)은 조금 흐리고, 15~27번 줄은 화면 아래 끝에 흐리게 걸립니다.</text>
<text x="70" y="472" font-size="13" fill="#444">렌즈에서 1~14번 줄로 가는 시선은 15~27번 줄 위를 바닥에서 5cm 이상 높이로 지나가므로, 그 줄의 차(높이 약 2cm)에 가리지 않습니다.</text>
</svg>